name: Project VITAL Security Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'experiment/**'
      - 'semester/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    name: Controlled Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Project VITAL security validation
        run: |
          bash environment/security-testing/run_stage1_validation.sh
