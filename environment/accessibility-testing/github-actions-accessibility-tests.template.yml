name: Project VITAL Accessibility Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'experiment/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  accessibility-tests:
    name: Accessibility CI
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install accessibility test dependencies
        working-directory: environment/accessibility-testing
        run: npm install

      - name: Run automated accessibility checks
        working-directory: environment/accessibility-testing
        run: npx playwright test tests/accessibility-ci.spec.js
